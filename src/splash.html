<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #172033; }
      main { width: min(480px, calc(100vw - 64px)); text-align: center; }
      .mark { width: 76px; height: 76px; margin: 0 auto 24px; display: block; }
      h1 { margin: 0 0 10px; font-size: 25px; letter-spacing: -.02em; }
      p { margin: 0; color: #697387; line-height: 1.7; }
      .bar { height: 4px; margin: 28px auto 0; width: 180px; overflow: hidden; border-radius: 999px; background: #dce3ef; }
      .bar::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #2864ee; animation: loading 1.15s ease-in-out infinite alternate; }
      @keyframes loading { from { transform: translateX(-10%); } to { transform: translateX(135%); } }
      @media (prefers-color-scheme: dark) { body { background: #11141a; color: #edf1f8; } p { color: #9aa4b5; } .bar { background: #2b313d; } }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./fish-black.svg" alt="DeepSeek 黑色金鱼图标">
      <h1>DeepSeek Harness Desktop</h1>
      <p id="message">正在启动…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
    <script>
      const message = new URLSearchParams(location.search).get('message')
      if (message) document.querySelector('#message').textContent = message
    </script>
  </body>
</html>
