<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在更新 DeepSeek Harness Desktop</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 40px; background: #f4f7fb; color: #172033; }
      main { width: min(640px, 100%); padding: 40px; border: 1px solid #dfe5ef; border-radius: 20px; background: rgba(255,255,255,.9); box-shadow: 0 20px 70px rgba(25,42,70,.12); }
      .top { display: flex; gap: 18px; align-items: center; }
      .mark { width: 58px; height: 58px; flex: none; }
      .eyebrow { margin: 0 0 5px; color: #2864ee; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
      .message { margin: 24px 0 0; color: #566176; line-height: 1.6; }
      .bar { height: 10px; margin-top: 18px; overflow: hidden; border-radius: 999px; background: #e2e8f2; }
      .bar > span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #2864ee, #66a0ff); transition: width .25s ease; }
      .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
      .metric { padding: 14px; border-radius: 12px; background: #f2f5fa; }
      .metric-label { color: #7a8598; font-size: 12px; }
      .metric-value { margin-top: 5px; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
      .notice { margin: 18px 0 0; color: #7a8598; font-size: 12px; line-height: 1.6; }
      @media (prefers-color-scheme: dark) { body { background: #101319; color: #edf1f8; } main { border-color: #2a303b; background: rgba(24,28,36,.94); } .message { color: #adb6c6; } .bar { background: #2b3340; } .metric { background: #202630; } .metric-label, .notice { color: #8f99aa; } }
      @media (max-width: 620px) { body { padding: 20px; } main { padding: 28px; } .metrics { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="top">
        <img class="mark" src="./fish-black.svg" alt="DeepSeek 黑色金鱼图标">
        <div><p class="eyebrow">Desktop Application Update</p><h1 id="title">正在下载桌面版更新</h1></div>
      </div>
      <p class="message" id="message">下载完成后会请你确认重启安装。</p>
      <div class="bar" role="progressbar" aria-label="桌面版更新进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
      <div class="metrics">
        <div class="metric"><div class="metric-label">网络线路</div><div class="metric-value" id="route">系统网络</div></div>
        <div class="metric"><div class="metric-label">进度</div><div class="metric-value" id="percent">0%</div></div>
        <div class="metric"><div class="metric-label">已下载</div><div class="metric-value" id="transferred">0 B</div></div>
        <div class="metric"><div class="metric-label">下载速度</div><div class="metric-value" id="speed">等待数据</div></div>
      </div>
      <p class="notice">这是 DeepSeek Harness Desktop 外壳更新，与“设置 → 桌面更新”里的 Harness Runtime 更新互相独立。</p>
    </main>
    <script>
      const targetVersion = new URLSearchParams(location.search).get('version')
      const title = document.querySelector('#title')
      const percent = document.querySelector('#percent')
      const route = document.querySelector('#route')
      const transferred = document.querySelector('#transferred')
      const speed = document.querySelector('#speed')
      const bar = document.querySelector('.bar')
      const fill = bar.querySelector('span')
      function bytes(value) {
        if (!Number.isFinite(value) || value <= 0) return '0 B'
        const units = ['B', 'KB', 'MB', 'GB']
        const unit = Math.min(Math.floor(Math.log(value) / Math.log(1024)), units.length - 1)
        return `${(value / 1024 ** unit).toFixed(unit === 0 ? 0 : 1)} ${units[unit]}`
      }
      if (targetVersion) title.textContent = `正在下载桌面版 ${targetVersion}`
      window.desktopHarness.onDesktopUpdateStatus(status => {
        if (status.route) route.textContent = status.route
        const progress = status.progress
        if (!progress) return
        const value = Math.max(0, Math.min(100, progress.percent || 0))
        percent.textContent = `${value.toFixed(1)}%`
        transferred.textContent = progress.total > 0 ? `${bytes(progress.transferred)} / ${bytes(progress.total)}` : bytes(progress.transferred)
        speed.textContent = progress.bytesPerSecond > 0 ? `${bytes(progress.bytesPerSecond)}/s` : '等待数据'
        fill.style.width = `${value}%`
        bar.setAttribute('aria-valuenow', String(value))
      })
    </script>
  </body>
</html>
